aid: unison
name: Unison
description: >-
  Unison (Unison Home Ownership Investors, headquartered in San Francisco with a
  second office in Omaha, and formerly FirstREX) is a residential home-equity investment manager that
  pioneered the equity sharing agreement and institutionalized the Home Equity Investment
  (HEI) asset class. Its consumer products are the Equity Sharing Agreement — up to
  roughly $500,000 in cash with no monthly payments and no interest, in exchange for a
  share of the home's future change in value over a 30-year term — and the Equity Sharing
  Home Loan, a fixed below-market-rate, interest-only mortgage. Unison securitizes its
  agreements and sells them to institutional investors, including a $300 million equity
  sharing home loan purchase partnership with Carlyle. It reaches homeowners through
  www.unison.com and services existing agreements through the MyUnison portal at
  my.unison.com. Unison publishes no public developer program, no API reference, no SDKs
  and no machine-readable contract of any kind; the only agent-facing artifact it serves
  is an llms.txt at the site root.
